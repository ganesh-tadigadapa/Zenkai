# Render blueprint for the Zenkai API — free tier.
#
# The frontend is NOT here: it stays on Vercel. The database is NOT here
# either: it is a free Neon Postgres, because Render deletes free databases
# after 30 days. Discovery runs on GitHub Actions
# (.github/workflows/discovery.yml), because Render has no free cron.
#
#   Render Dashboard -> New -> Blueprint -> point at this repository.
#
# Secrets are deliberately absent. Every `sync: false` value must be set by
# hand in the dashboard on first deploy; Render will prompt for each one.
# Nothing secret belongs in this file, because this file is committed.

services:
  # ---------------------------------------------------------------------
  # The API. A free instance sleeps after 15 minutes idle, and because the
  # frontend is server-rendered, waking it becomes the first visitor's page
  # load (roughly 30-60s). Move to `starter` to remove that.
  # ---------------------------------------------------------------------
  - type: web
    name: zenkai-api
    runtime: python
    plan: free
    rootDir: backend
    # ENV=production skips create_all() at startup, so the schema and the
    # catalogue are put in place here. Free instances have no pre-deploy
    # step, so seeding runs in the build, which can reach Neon over the
    # public internet. The seeder is idempotent: it creates missing tables
    # and skips records that already exist.
    buildCommand: pip install -r requirements.txt && python -m app.seed.run
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # Neon connection string (postgresql://...?sslmode=require). config.py
      # rewrites the scheme to `postgresql+psycopg://`.
      - key: DATABASE_URL
        sync: false

      - key: ENV
        value: production # stops create_all() at startup AND demo fallback
      - key: DEBUG
        value: "false"

      # The Vercel origin. allow_credentials=True is set on the middleware,
      # so "*" is not a legal value here — origins must be explicit.
      - key: CORS_ORIGINS
        sync: false

      - key: AI_PROVIDER
        value: stub # heuristic-only; needs no API key

      # Service-account secret for /api/v1/admin/*. Must match the Vercel
      # project's ZENKAI_ADMIN_TOKEN exactly.
      - key: ADMIN_TOKEN
        sync: false

      # The seeded demo accounts' passwords. The defaults in config.py are
      # published in the README, so both MUST be overridden here.
      - key: DEMO_USER_PASSWORD
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false

      # ALLOW_DEMO_FALLBACK is deliberately NOT set. It defaults to off
      # whenever ENV != development. Setting it true would let every
      # signed-out visitor act as the same demo student.
